apiVersion: v1
kind: Namespace
metadata:
  name: token-lifetime-webhook
  labels:
    app.kubernetes.io/name: token-lifetime-webhook
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-lifetime-webhook
  namespace: token-lifetime-webhook
  labels:
    app.kubernetes.io/name: token-lifetime-webhook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: token-lifetime-webhook
  labels:
    app.kubernetes.io/name: token-lifetime-webhook
rules:
  - apiGroups: ["tokenfiltering.openshift.io"]
    resources: ["tokenlifetimepolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: token-lifetime-webhook
  labels:
    app.kubernetes.io/name: token-lifetime-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: token-lifetime-webhook
subjects:
  - kind: ServiceAccount
    name: token-lifetime-webhook
    namespace: token-lifetime-webhook
---
apiVersion: v1
kind: Service
metadata:
  name: token-lifetime-webhook
  namespace: token-lifetime-webhook
  labels:
    app.kubernetes.io/name: token-lifetime-webhook
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: token-lifetime-webhook-tls
spec:
  ports:
    - name: https
      port: 443
      targetPort: https
  selector:
    app.kubernetes.io/name: token-lifetime-webhook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-lifetime-webhook
  namespace: token-lifetime-webhook
  labels:
    app.kubernetes.io/name: token-lifetime-webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: token-lifetime-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: token-lifetime-webhook
    spec:
      serviceAccountName: token-lifetime-webhook
      containers:
        - name: webhook
          image: quay.io/example/token-lifetime-webhook:latest
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:8443
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
          ports:
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls
          secret:
            secretName: token-lifetime-webhook-tls
