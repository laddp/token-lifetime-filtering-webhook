apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifests.yaml

# Keep the deployment image in one Kustomize-managed location. Push a new
# image to this tag, then re-apply the overlay to roll it out.
images:
  - name: quay.io/example/token-lifetime-webhook
    newTag: latest
