# Example: mutate TokenRequests over 1y down to the maximum (composites like 1h30m also work).
apiVersion: tokenfiltering.openshift.io/v1alpha1
kind: TokenLifetimePolicy
metadata:
  name: cluster
spec:
  maxExpiration: 1y
  onExceed: Mutate
  exemptNamespaces:
    - openshift
    - openshift-*
    - kube-*
